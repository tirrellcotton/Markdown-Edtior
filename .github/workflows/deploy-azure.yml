name: Deploy Markdown Editor to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: markdown-editor
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PROJECT_PATH: MarkdownEditor.Web/MarkdownEditor.Web.csproj
  PUBLISH_PATH: ./publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: MarkdownEditor.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix MarkdownEditor.Web

      - name: Build frontend assets
        run: npm run build --prefix MarkdownEditor.Web

      - name: Restore .NET dependencies
        run: dotnet restore MarkdownEditor.slnx

      - name: Publish application
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-restore
          --output ${{ env.PUBLISH_PATH }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
