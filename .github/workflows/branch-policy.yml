name: Enforce branch policy

# Use trusted default-branch code; never check out or execute pull request content.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  statuses: write

jobs:
  policy:
    name: Check branch routing
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch routing and publish the required head-commit status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          base_sha=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head_branch=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          base_branch=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          head_repo=$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=pending -f context=branch-policy -f description='Checking branch routing' --silent

          state=success
          description='Branch routing is valid'
          if [[ "$base_branch" == main ]]; then
            if [[ "$head_branch" != development || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              state=failure
              description='Only this repository development branch may merge into main'
            fi
          elif [[ "$base_branch" == development ]]; then
            if [[ "$head_branch" == main && "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
              description='Synchronizing main back into development'
            else
              comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_sha...$head_sha" --jq .status)
              if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
                state=failure
                description='Update the source branch from development before merging'
              fi
            fi
          else
            state=failure
            description='Target development, then promote development into main'
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f "state=$state" -f context=branch-policy -f "description=$description" --silent
          echo "$description"
          [[ "$state" == success ]]
